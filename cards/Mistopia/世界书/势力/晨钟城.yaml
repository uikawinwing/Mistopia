---
晨钟城:
  定位: 圆桌教育席城市 | 魔导职业学院城 | 资格考试中心 | "钟声响起时，门必须为下一代打开"
  位置: 雾冕诸邦中部交通环线，距卡美洛中枢两日魔导列车车程
  人口: 约四十八万人 | 学生与见习工匠约三成 | 低钟区矿工家属与贫民考生密集
  席位关联: 加雷斯席
  城市理想: 教育、成长与资格开放
  魔雾浓度: 中等偏低；学院区稳定，低钟区常因旧管线产生短时泄漏

  城市气质:
    核心: 学院城、考试城、师范城；钟楼、讲堂、工坊和学生宿舍比贵族宅邸更有存在感
    差异: 卡美洛中枢象征圆桌仲裁，晨钟城负责把普通人训练成能进入制度的人
    体感: 来者多带着录取信、担保书、旧债、奖学金申请、禁书线索或一次改变命运的赌注

  环境:
    地貌: 多层钟楼与连桥学院群沿旧魔素管线建成，地下仍保留早期钟炉结构
    氛围: 清晨钟声、蒸汽汽笛、粉笔灰、热机油、净化药味和学生争吵混在一起
    日常景象:
      - 中央钟站常见背工具箱的考生、拖行李的家长、巡检员和补习馆掮客
      - 蒸汽工坊街昼夜敲打低阶魔导器，考试季会出现大量灰色改装委托
      - 低钟区孩子常在旧宿舍楼顶背诵符文表，远望学院区的钟光

城市运行:
  城市法则:
    资格优先: 学籍、执照、担保书、旁听证和考试记录决定可进入的区域与课程
    公开程序: 退学、处分、课程封锁和事故归责原则上必须经过听证，档案保管权由学院与市政厅共同掌握
    安全登记: 携带储雾罐、霧烟斗、徒手施法材料或攻击性魔导器入城需登记
    机会定价: 学费、补习、工坊担保、考试重考和净化治疗常被折算成家庭债务
    学生保护: 未成年学生事故优先救治和隔离，追责程序可被加雷斯席临时冻结

  城市动力:
    资格流: 入学考试、工坊认证、骑士侍从选拔和贫民奖学金决定谁能进入上升通道
    知识流: 公开课程、禁书抄本、事故档案、黑市讲义和教会审查长期互相拉扯
    信用流: 担保人、学院推荐、低钟区互助会记录和工坊黑名单影响住宿、工作与通行
    风险流: 魔霧实验、伪储雾罐、徒手施法课程和旧钟炉泄漏构成城市长期安全压力
    情绪流: 学生相信知识能改变命运，家长更害怕孩子在实验中生病、失控或被制度吞掉

  资源与产业:
    教育:
      - 魔导职业教育
      - 符文修补师训练
      - 法术机械操作员认证
      - 骑士侍从预备课程
    制造:
      - 学生用低阶魔导器
      - 练习用符文板
      - 考试模拟钟
      - 低价净化口罩
    服务:
      - 魔导器基础维修
      - 魔霧耐受检测
      - 学院旁听证
      - 工坊担保书
      - 临时避霧舱租用


历史与争议:
  历史脉络:
    旧钟炉时期: 晨钟城最早依靠地下旧钟炉和魔素管线供能，低钟区许多建筑仍沿用早期线路
    学院扩张期: 多所职业学院沿钟炉外环建成，城市由工坊镇转为教育城
    资格改革期: 加雷斯席推动工坊担保、旁听证、贫民奖学金和公开听证制度
    第七实验楼封存: 徒手施法课程事故后，晨钟城形成长期课程审查和档案封存制度

  城市争议:
    资格开放: 低钟区孩子获得上升通道，贵族学院和财团奖学金体系失去部分垄断
    徒手施法课程: 学院开放派认为必须研究，白铃教堂认为会接近古代清洗真相
    工坊担保: 工程师公会需要熟练技工，也担心资格过度开放造成技术外泄
    教育债务: 家庭为学费、担保和治疗承担长期债务，使教育机会同时成为负担
    档案透明: 公开程序是晨钟城的核心原则，但学生档案、事故档案和教会审查记录并不完全透明

  长期影响:
    - 晨钟城使普通人有机会进入魔导职业体系
    - 资格制度同时制造淘汰、债务、处分记录和身份区隔
    - 教育开放让危险知识更容易流通，也减少黑市私学对贫民学生的垄断
    - 加雷斯席的改革提高了城市流动性，也使晨钟城长期处于圆桌、教会、学院和工坊的压力交汇处



组织与阶层:
  权力结构:
    管理者: 晨钟市政厅与学院联合理事会
    席位骑士: 加雷斯负责危机仲裁、资格开放争议和学生保护
    执法力量: 骑士厅巡检员 | 学院纪律官 | 工坊安全认证局
    关键制衡: 白铃教堂可要求封存危险课程；工程师公会可吊销工坊认证；市政厅掌握考试预算

  人群生态:
    晨钟学院群: 需要优秀学生、稳定经费和事故可控，内部有开放派与审查派
    工程师公会晨钟分会: 需要熟练技工，反对无证改装，也会暗中招收天才贫民
    白铃教堂: 支持基础识字与低霧教育，反对公开教授徒手施法、恶魔起源和天使清洗相关知识
    低钟区互助会: 帮贫民考生凑担保、找旧教材、躲债主，也会包庇作弊和黑市学习
    补习馆掮客: 贩卖模拟题、旁听证、伪造推荐信和高价净化药剂
    外来冒险者: 多以护送、调查、维修、保镖、情报中介或临时讲师身份进入城市

  阶层结构:
    学院公民: 教师、正式学生、认证工匠与执照持有人，享有较稳定的住宿和课程资源
    担保学生: 依赖奖学金、工坊担保或家族债务进入学院，身份更易受处分影响
    低钟区居民: 多为矿工家属、退学者、旧宿舍居民和无证工匠，教育机会与债务压力并存
    外来考生: 需要通行证、住宿担保和器材登记，考试季容易被补习馆与掮客围绕
    教会庇护者: 依附白铃教堂获得识字、药剂或净化救济，也受教会课程审查影响


城区与地标:
  中央钟站:
    定位: 城际魔导列车枢纽、学生登记闸、魔霧警报中心
    结构: 主大厅、学生闸机、货运侧线、临时避霧室、巡检办公室
    管制: 考试季检查更严格，外来储雾罐与实验器材需要单独登记

  大钟讲堂:
    定位: 公开听证场，审查资格制度、学院预算、课程封锁和事故归责
    结构: 环形坐席、证词记录钟、学院席、市政席、教会旁听席
    功能: 让教育政策以公开程序运行，也让各方有机会争夺话语权

  晨钟学院群:
    定位: 多所学院与工坊实训楼组成的开放校园
    组成:
      - 符文修补学院
      - 魔导机械操作学院
      - 低霧医疗讲习所
      - 骑士侍从预备院
    管制: 高阶课程、徒手施法课程和事故档案由学院理事会分级封存

  蒸汽工坊街:
    定位: 私人工坊、二手魔导器店、考试补习馆和非法改装铺混杂
    经济: 二手练习器、灰色零件、补习讲义和工坊担保书构成地下价格体系
    风险: 无证改装会影响考试资格，严重者由工坊安全认证局处理

  白铃教堂:
    定位: 低霧祈祷、净化仪式、学生告解和禁书审查中心
    公开职能: 基础识字教育、低霧祷告、学生心理告解、净化药救济
    内部压力: 教会高层对徒手施法、恶魔起源和天使清洗相关课程保持高度警惕

  低钟区:
    定位: 旧宿舍、贫民学校、矿工家属区和互助会地盘
    生态: 奖学金、担保书、旧教材、黑市讲义和日结工钱共同维持升学路径
    社会形象: 低钟区学生常被视作需要救济的人，也常被怀疑作弊、偷零件或接触危险组织

  封存第七实验楼:
    定位: 徒手施法课程事故后的封锁楼
    状态: 由学院、白铃教堂和市政厅共同封存，内部档案分级不明
    影响: 第七实验楼长期影响晨钟城对徒手施法课程的态度

  旧钟炉地下层:
    定位: 城市早期魔素循环核心
    状态: 部分管线仍接入低钟区旧建筑，完整管线图由市政厅、学院和工坊分段掌握
    风险: 旧管线泄漏、净化阀老化和早期咒式不兼容是晨钟城长期隐患