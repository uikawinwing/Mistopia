---
圆桌诸城:
  概念:
    - 圆桌诸城是雾冕诸邦的主要文明圈，由多座依靠魔力矿石与魔导蒸汽系统运作的城市构成。
    - 圆桌诸城整体被设计为钟面结构，十二席城市环绕卡美洛中枢，分别对应钟面的十二个刻度。
    - 卡美洛中枢位于诸城交通、议政与誓约网络的中心，是圆桌会议、中央仲裁权与王权正当性的象征。
    - 当前亚瑟王位处于空缺状态，亚瑟席无人正式继承；卡美洛中枢仍维持钟轴功能，但中央仲裁能力下降。
    - 每座核心城市通常有一名席位骑士作为守护者、危机仲裁者与城市理想象征。
    - 城市日常治理仍由市政厅、工程师公会、居民议会、工坊行会、学院、教会或财团共同运作。

  当前状态:
    亚瑟王位: 空缺
    亚瑟席: 无正式继承者
    卡美洛中枢:
      状态: 仍为圆桌诸城的钟轴与中央王城
      问题:
        - 缺乏完整王权正当性
        - 中央仲裁能力下降
        - 十二席城市的理想逐渐失衡
        - 相邻城市的合作关系开始转向垄断、封锁或制度摩擦
        - 对角城市的理念冲突更容易升级为公开危机

  城市差异:
    - 每座城市代表一种乌托邦方案，例如医疗、教育、秩序、自由、信仰、工业、共存、探索或进化。
    - 不同城市有不同魔雾浓度、能源来源、法律尺度、怪物风险与组织势力。
    - 城市之间可合作、竞争、互相封锁或交换技术。
    - 一座城市的理想越成功，越可能把不适合该理想的人推到边缘。
    - 城市之间的钟面距离不仅代表空间距离，也代表职能关联、政治亲疏与制度冲突强度。

  钟面结构:
    中心:
      城市: 卡美洛中枢
      席位: 亚瑟席 / 中央席
      当前状态: 王位空缺
      职能: 仲裁十二席、维持圆桌诸城同步运转、分配中央权限

    12点:
      城市: 圣铎城
      席位: 信仰席
      职能: 教会、慈善、道德改革与王权神圣性

    1点:
      城市: 蔷薇庄园城
      席位: 贵族席 / 礼法席
      职能: 贵族庄园、社交季、婚姻联盟与继承秩序

    2点:
      城市: 晨钟城
      席位: 教育席 / 加雷斯席
      职能: 学院、公学、寄宿制、资格考试与学生自治

    3点:
      城市: 金衡城
      席位: 商业席 / 契约席
      职能: 交易所、银行、拍卖、保险与商会体系

    4点:
      城市: 雾港城
      席位: 远征席 / 海务席
      职能: 港口、船队、地理学会、博物馆远征与遗物回收

    5点:
      城市: 玻璃穹城
      席位: 生态席 / 农政席
      职能: 温室、植物园、庄园农业、魔物生态与异常物种驯化

    6点:
      城市: 炉桥城
      席位: 工业席 / 铸造席
      职能: 工厂、铁路、煤矿、蒸汽机关与工人阶级管理

    7点:
      城市: 白塔城
      席位: 医疗席 / 生命席
      职能: 医院、解剖剧场、疯人院、济贫院与公共卫生

    8点:
      城市: 黑伞城
      席位: 治安席 / 情报席
      职能: 警署、侦探社、贫民窟、密探与地下社团监控

    9点:
      城市: 钟裁城
      席位: 司法席 / 档案席
      职能: 法院、档案馆、登记局、律师会馆与身份裁决

    10点:
      城市: 王冠剧院城
      席位: 舆论席 / 娱乐席
      职能: 剧院、报社、出版、马戏、幻灯演出与公共叙事

    11点:
      城市: 白厅城
      席位: 行政席 / 文官席
      职能: 市政厅、内阁、文官系统、公文权限与城市危机调度

  相邻规则:
    - 相邻城市通常具有高频合作关系，同时也存在日常摩擦。
    - 间隔一格的城市通常构成产业链或制度链关系。
    - 对角城市通常代表理念对冲与长期制度矛盾。
    - 当卡美洛中枢维持稳定时，十二城的冲突由圆桌会议仲裁。
    - 当中央仲裁能力下降时，相邻合作会变成垄断、封锁或利益绑定，对角冲突会升级为公开危机。

  主要相邻链:
    上弧线:
      城市: 圣铎城 -> 蔷薇庄园城 -> 晨钟城
      主题: 信仰、贵族与教育共同支撑统治资格
      合作:
        - 教会提供道德教育
        - 贵族提供捐赠、奖学金与董事席位
        - 晨钟城培养未来文官、神职人员、骑士与贵族继承人
      冲突:
        - 贫民学生挑战贵族子弟
        - 教会试图控制课程
        - 贵族试图垄断资格

    右上弧线:
      城市: 晨钟城 -> 金衡城 -> 雾港城
      主题: 教育、商业与远征构成帝国扩张链
      合作:
        - 晨钟城训练会计师、测量员、船医、殖民官与翻译员
        - 金衡城为远征提供贷款、保险和股份
        - 雾港城执行航运、远征和遗物回收
      冲突:
        - 金衡城试图将教育资格商品化
        - 雾港城质疑学院派不懂实地
        - 远征失败会引爆债务与舆论危机

    右下弧线:
      城市: 雾港城 -> 玻璃穹城 -> 炉桥城
      主题: 外部输入、生态驯化与工业加工
      合作:
        - 雾港城带回外来植物、矿物、魔物标本与遗物
        - 玻璃穹城负责分类、驯化、培育与生态评估
        - 炉桥城把原料转化为机器、铁路、武器和城市设施
      冲突:
        - 远征者可能偷运危险物种
        - 生态席反对工业席过度开采
        - 工业污染会破坏温室与农政系统

    下弧线:
      城市: 炉桥城 -> 白塔城 -> 黑伞城
      主题: 工业伤害、贫病与治安压力
      合作:
        - 炉桥城制造大量伤患、污染病和贫民问题
        - 白塔城处理工伤、疫病、精神崩溃与人体实验后果
        - 黑伞城压制罢工、犯罪、走私和地下组织
      冲突:
        - 工厂主试图隐瞒事故
        - 医院可能索取实验样本
        - 密探将病患与工人运动视为治安风险

    左下弧线:
      城市: 黑伞城 -> 钟裁城 -> 王冠剧院城
      主题: 调查、审判与舆论传播
      合作:
        - 黑伞城提供证据、证人和秘密档案
        - 钟裁城进行审判、登记和裁决
        - 王冠剧院城将案件改写成新闻、戏剧和连载小说
      冲突:
        - 密探不愿公开情报
        - 法院害怕舆论审判
        - 报社为了销量夸大罪案

    左上弧线:
      城市: 王冠剧院城 -> 白厅城 -> 圣铎城
      主题: 舆论、行政与信仰共同制造统治正当性
      合作:
        - 王冠剧院城塑造英雄、恶徒和公共情绪
        - 白厅城将舆论转化为政策、禁令和改革法案
        - 圣铎城为政策提供道德解释
      冲突:
        - 报纸揭露行政丑闻
        - 白厅城审查剧院与出版
        - 教会谴责娱乐业败坏风俗

  主要对角轴:
    圣铎城_炉桥城:
      主题: 信仰与工业
      冲突: 灵魂、道德与神圣秩序，对抗煤烟、机器与劳工身体。

    金衡城_钟裁城:
      主题: 资本与法律
      冲突: 契约自由与交易利益，对抗法律边界、登记秩序与裁决权。

    晨钟城_黑伞城:
      主题: 教育与治安
      冲突: 成长、资格与未来，对抗监控、污点与被记录的过去。

    雾港城_王冠剧院城:
      主题: 远征与叙事
      冲突: 真实远方、血腥远征与殖民现场，对抗英雄故事、报纸传奇与舞台神话。

    玻璃穹城_白厅城:
      主题: 生态与行政
      冲突: 生长、自然周期与不可完全控制的生命，对抗规划、指标与文书治理。

    蔷薇庄园城_白塔城:
      主题: 血统与身体
      冲突: 血统、继承、婚姻与家族名誉，对抗疾病、遗传、医学真相与身体记录。

  城市基础设施:
    交通:
      - 魔导蒸汽列车
      - 飞空艇港
      - 黄铜升降桥
      - 城际检查站
    安全:
      - 净化塔
      - 魔雾浓度警报钟
      - 骑士厅巡检所
      - 工坊安全认证局
    民生:
      - 公共照明炉
      - 霧病医院
      - 魔导水泵
      - 市民避霧所
      - 小型法术服务店