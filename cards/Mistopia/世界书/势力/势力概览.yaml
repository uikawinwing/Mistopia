---
卡美洛钟轴与十二城席:
  卡美洛中枢:
    钟面位置: 0点 (轴心)
    定位: 圆桌誓约物理汇聚点
    状态: 王座空缺，中央仲裁停摆，钟轴无法平息边缘城市的摩擦

  圣铎城:
    钟面位置: 12点
    席位: 信仰净化席 (加拉哈德)
    乌托邦哲学: 绝对纯净。通过严苛的低雾生活法则与神职教化，防止古代大清洗的悲剧重演
    反乌托邦代价: 异端迫害。任何魔雾病患、徒手施法者或不认同该秩序的人都会被视为“污染源”遭到物理消除
    箱庭体验: 洁白高耸的尖塔群，终日回响的圣歌，以及被焚烧的未经净化的旧物

  蔷薇庄园城:
    钟面位置: 1点
    席位: 礼法荣光席 (高文)
    乌托邦哲学: 绝对体面。血统、教养与可见的正义维持着社会的完美运转，市民因仰望高贵的典范而感到安心
    反乌托邦代价: 腐化掩饰。为了维持光鲜的表象，所有丑闻、伤痛与畸形都被残忍地塞进下水道与密室
    箱庭体验: 终年盛开的人造蔷薇，华丽的社交舞会，与阴暗潮湿、布满告密者的佣人通道

  晨钟城:
    钟面位置: 2点
    席位: 知识开放席 (加雷斯)
    乌托邦哲学: 绝对启蒙。没有门槛的讲堂，即使是最底层的矿工之子也有权获取解析世界法则的知识
    反乌托邦代价: 危险溢出。心智未成熟者过早接触古代咒式与高危技术，导致频繁的学生失控与黑市泛滥
    箱庭体验: 随处可见的破旧黑板，蒸汽轰鸣的实训工坊，以及总带着严重黑眼圈与机油味的学生群体

  金衡城:
    钟面位置: 3点
    席位: 契约流转席 (凯)
    乌托邦哲学: 绝对量化。万物皆有标价且允许自由交易，资本的流动带来极高的行政与生活效率
    反乌托邦代价: 价值吞噬。生命、记忆甚至部分器官使用权都被抵押，无法偿还债务者被注销为人资格
    箱庭体验: 滴答作响的黄金算盘，彻夜不眠的交易所，以及被机械索套牵引的债务奴隶

  雾港城:
    钟面位置: 4点
    席位: 远征探索席 (珀西瓦尔)
    乌托邦哲学: 绝对拓荒。勇敢驶向高雾区与古代遗迹，为文明带回新资源、新物种与未知真相
    反乌托邦代价: 灾厄输入。贪婪的探险家不断将未知的古代诅咒、嗜血遗物与异乡瘟疫带回腹地
    箱庭体验: 桅杆林立的飞空艇码头，充斥着异国香料与干涸血腥味的酒馆，以及堆满诡异化石的博物馆

  玻璃穹城:
    钟面位置: 5点
    席位: 生态共存席 (帕拉米德斯)
    乌托邦哲学: 绝对融合。人类应当与复苏的魔法生物及高危植物建立共生关系，打破物种隔离的傲慢
    反乌托邦代价: 异种侵蚀。过度包容导致生态失控，寄生、变异以及市民被当作温床的事件屡见不鲜
    箱庭体验: 巨大的恒温水晶温室，破壁而出的巨大藤蔓，以及瞳孔呈现非人特征的温和居民

  炉桥城:
    钟面位置: 6点
    席位: 工业生存席 (鲍斯)
    乌托邦哲学: 绝对生产。轰鸣的魔导炉为所有城市提供能源底线，保证文明不被饥饿与寒冷吞没
    反乌托邦代价: 燃料耗材。将劳工作为蒸汽机械的消耗型部件，肺部填满煤渣与残雾，换取最低廉的口粮
    箱庭体验: 永远不见天日的铁锈天空，纵横交错的滚烫管道，以及连绵不断的机械撞击与矿工咳嗽声

  白塔城:
    钟面位置: 7点
    席位: 生命肉体席 (卢坎)
    乌托邦哲学: 绝对存活。极致的魔导医疗与外科解剖技术，确保将人类从必死的重创与魔雾病中抢救回来
    反乌托邦代价: 尊严解构。为了维持生命体征，人体被肆意切割与替换，病人沦为医生验证新技术的实验品
    箱庭体验: 充满防腐剂气味的白色回廊，彻夜亮灯的解剖剧场，以及靠满身管线和黄铜义肢行走的半休克者

  黑伞城:
    钟面位置: 8点
    席位: 治安监控席 (加赫里斯)
    乌托邦哲学: 绝对安全。密不透风的情报网与预防性逮捕，将所有犯罪扼杀在街头火拼或恐怖袭击发生之前
    反乌托邦代价: 隐私真空。任何人都不存在隐秘空间，思想被解读，邻里互相构陷，恐惧本身成为统治工具
    箱庭体验: 终年阴雨的漆黑街道，随处可见的金属球形眼，以及永远穿着黑色雨衣沉默无言的行人

  钟裁城:
    钟面位置: 9点
    席位: 司法刻板席 (贝狄威尔)
    乌托邦哲学: 绝对程序。不偏不倚的法度机器，消除人为的情感干预，保障一切社会运转都有法可依
    反乌托邦代价: 机械无情。法条陷入死循环，错判不被撤回，无辜者被冷酷的文书碾碎而求告无门
    箱庭体验: 堆积如山的泛黄卷宗，高耸冰冷的审判钟摆，法官如同设定好发条的机械般执行裁决

  王冠剧院城:
    钟面位置: 10点
    席位: 舆论情感席 (崔斯坦)
    乌托邦哲学: 绝对慰藉。提供无尽的戏剧、新闻传奇与精神食粮，让承受苦难的市民获得生活的热情与意义
    反乌托邦代价: 真实剥夺。痛苦被包装成消费品，真相被涂改并娱乐化，整座城市沉溺于致幻的虚假叙事中
    箱庭体验: 永远亮着霓虹雾灯的舞台，街头飞舞的号外传单，以及带着夸张面具、笑得撕心裂肺的演员

  暮钟城:
    钟面位置: 11点
    席位: 秘钥封存席 (阿格规文)
    乌托邦哲学: 绝对门禁。将导致世界毁灭的古代真相、禁忌魔学集中隔离，由极少数精英背负常理之外的重压
    反乌托邦代价: 思想禁锢。以保护为名剥夺绝大多数人的认知权，形成不可逾越的知识阶级与独裁高墙
    箱庭体验: 厚重铅门紧锁的巨大书库，需要身份验证的每一条走廊，以及在阴影中注视访客的无瞳守卫

  十二城席对角线哲学对冲录:
    12点(圣铎) vs 6点(炉桥): 灵魂洁癖对抗生存黑灰。圣铎认为只要灵魂纯净，冻死也是回归天国；炉桥认为先要把炉火烧旺，活着的人才有资格谈论神。
    1点(蔷薇) vs 7点(白塔): 体面皮囊对抗崩坏内脏。蔷薇要求人们优雅无瑕地死去；白塔则宣称只要心脏还在跳动，缝合得再丑陋也是医学的胜利。
    2点(晨钟) vs 8点(黑伞): 知识开放对抗隐秘监控。晨钟主张打开所有的抽屉让光照进去；黑伞则致力于在每个人的抽屉里安装监视器。
    3点(金衡) vs 9点(钟裁): 资本扩张对抗刻板法度。金衡试图用货币买断法条的解释权；钟裁则致力于用死板的程序锁死哪怕一枚铜币的非法流通。
    4点(雾港) vs 10点(王冠): 惨烈远方对抗精致幻象。雾港的探险家带着断肢和血泊带回冰冷真相；王冠的剧场里则把断肢写成英雄的勋章供人消遣。
    5点(玻璃穹) vs 11点(暮钟): 物种交融对抗绝对防线。玻璃穹试图拆除人类与魔物的墙；暮钟则主张给每一本书、每一个思想都装上厚重的防爆门。

游离组织:
  复古派:
    核心受众: 高雾区原住民、徒手施法者血脉、荒野法师
    行为逻辑: 认为魔雾回升是古代高维世界修正错误的“免疫反应”，低魔工业才是试图欺骗世界的肿瘤
  人体改造派:
    核心受众: 狂热的魔导军工学者、罹患绝症的富豪、失去底线的解剖室医师
    行为逻辑: 认定人类的原始肉体已经是被淘汰的旧版本，必须强行嫁接魔导器官或古代生物组织，完成强行进化
  工程师公会:
    核心受众: 维修技师、结界维护员、魔导车间主任
    行为逻辑: 不关心乌托邦的理想，只在乎压力表是否在红线以下，掌握着掐断任何城市底层能源的隐性权力
  保守教会:
    核心受众: 畏惧魔雾的底层市民、寻找寄托的工厂劳工
    行为逻辑: 掌握部分关于“旧神”与大清洗的残缺记录，利用民众对未知的恐惧收取赎罪券，并私藏被禁锢的圣遗物