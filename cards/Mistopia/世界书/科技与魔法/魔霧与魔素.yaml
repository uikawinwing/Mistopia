魔霧与魔素:
  魔霧:
    定义: 空气中的魔力，可被生物、环境、神迹、法术与魔导机械感应或利用
    当前状态: 大消隐后曾长期稀薄，如今正随魔素矿工业而逐年回升
    风险:
      - 高浓度魔霧可能引发霧病、幻听、皮肤结晶、呼吸困难、记忆错乱或器官衰竭
      - 低魔时代后的现代人通常缺乏高霧耐受性

  魔素矿:
    定义: 地下高密度魔力矿脉，可经魔导炉、咒式回路与蒸汽机构转化为稳定能源
    社会用途:
      - 城市照明
      - 蒸汽列车与飞空艇
      - 工坊生产
      - 医疗器械
      - 防卫结界
      - 民用低阶法术装置
    定调:
      - 魔素矿不是插入设备即可施法的万能魔法石
      - 它是需要工业结构驯服的危险能源

  燃后残雾:
    定义: 魔导炉与工坊排出的不稳定残余魔霧，可能混有破碎咒式、金属粉尘与过载魔力
    风险:
      - 霧病
      - 机械失控
      - 现代生物异变
      - 魔法生物被吸引到城市边缘
      - 城市边缘与工坊区污染加重