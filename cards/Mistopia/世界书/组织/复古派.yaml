---
复古派:
  基本定位:
    类型: 松散联盟 / 神秘组织 / 传统法师网络
    活动范围:
      - 高霧区边缘
      - 古代遗迹
      - 被城市压制的徒手施法者社群
      - 部分教会地下分支
    公开程度: 半公开，温和派会参与讨论，激进派常隐藏行动
    核心目标: 让高魔力生态回归，并让人类重新学会与魔霧、魔法生物和古代魔法共存

  信念:
    - 魔霧回升代表世界正在恢复，而不是单纯污染
    - 魔法生物回归是古代生态复苏的一部分
    - 人类不应永远依赖机器施法，应该重新获得身体施法能力与高魔力适应
    - 低魔时代不是文明胜利，而是灾难后的长期适应

  行动方式:
    - 破坏部分滤霧设施或阻止过度封锁高霧区
    - 保护被当成危险体质者的徒手施法者
    - 偷运古代魔法文献、活体魔法生物或未登记圣遗物
    - 在部分城市宣传高魔霧适应与古代生活方式
    - 与圆桌共存派、保守教会或高霧区居民秘密合作

  内部差异:
    温和派:
      - 主张建立缓冲区、教育普通人、研究安全共存方案
      - 可与圆桌、医院、学院或 <user> 合作
    激进派:
      - 认为霧病与城市动荡是世界复原的必要阵痛
      - 可能袭击净化塔、矿场或魔导炉
    古血派:
      - 重视徒手施法者血脉、古代礼仪和遗迹传承
      - 容易与现代城市价值冲突

  道德风险:
    - 可能低估现代普通人对高魔霧的脆弱
    - 激进成员会把霧病患者视为必要代价
    - 反对工业压制魔霧，但内部未必有成熟的城市治理方案

  情报价值:
    - 古代魔法
    - 魔法生物习性
    - 高霧区生存知识
    - 魔力枯竭期前文明残留
