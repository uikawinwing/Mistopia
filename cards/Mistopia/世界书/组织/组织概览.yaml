---
主要组织:
  - 复古派: 徒手施法者、传统法师与高霧区居民组成的松散联盟 | 业务: 古代魔法、高霧区知识、魔法生物与遗迹情报 | 立场: 魔霧回升是世界复原，不是单纯污染
  - 人体改造派: 魔导科学院分支、军工赞助网络与封闭医院组成的研究共同体 | 业务: 抗霧药、魔素适应、魔导义体接口、霧病治疗资料 | 立场: 人类必须重新适应高魔力世界

潜在扩展组织:
  - 保守教会: 低霧祈祷、净化仪式、圣遗物和禁书审查网络 | 业务: 净化、救济、课程审查、神迹残响研究 | 压力: 高层掌握部分古代清洗真相
  - 工程师公会: 魔导工坊、认证局、维修师和城市基础设施工程师网络 | 业务: 魔导器安全认证、城市炉网维护、工坊担保 | 压力: 技术开放与事故责任互相拉扯
  - 低钟区互助会: 晨钟城低钟区居民、贫民考生和旧宿舍网络 | 业务: 奖学金互助、旧教材、担保介绍、灰色学习渠道 | 压力: 容易被补习馆掮客或激进组织利用
