---
人体改造派:
  基本定位:
    类型: 激进研究共同体 / 魔导科学院分支 / 军工赞助网络
    活动范围:
      - 高霧实验区
      - 大型学院城
      - 军工工坊
      - 财团资助的封闭医院
    公开程度: 表面合法，核心实验常被隐藏或包装成医疗研究
    核心目标: 让人类重新获得高魔霧耐受、魔力感知和身体施法能力，并与魔导科技结合

  核心理论:
    - 高魔霧环境可迫使人体产生魔素适应
    - 在高霧区出生的新世代已出现少量耐魔性、魔力感知或徒手施法征兆
    - 若控制魔雾浓度、药物、咒式刺激与机械辅助，人类可能成为同时使用身体魔法与魔导科技的新种
    - 文明不应永远把奇迹外包给机器

  行动方式:
    - 建立封闭式高霧实验区
    - 研究抗霧药、魔素适应手术与咒式神经接合
    - 收集霧病患者、徒手施法者与高霧区新生儿资料
    - 与军方或财团交换研究成果以获得资金
    - 用医疗、义体或工伤补偿名义招募志愿者

  内部差异:
    医疗派:
      - 想治疗霧病和魔素损伤
      - 更重视知情同意和长期观察
    军工派:
      - 想制造耐霧士兵、魔导义体驾驶员或新型骑士候选
      - 容易隐瞒失败案例
    进化派:
      - 把当代痛苦视为未来人类的成本
      - 最容易越过伦理边界

  道德风险:
    - 容易把当代人的痛苦视为未来人类的成本
    - 实验可能制造畸变者、失控魔导器官、霧化怪物或精神崩溃案例
    - 温和研究与禁忌人体实验之间界线模糊
    - 成功个体可能被城市、军方、圆桌或财团争夺

  资源与资料:
    - 抗霧药
    - 高霧区装备
    - 魔导义体接口
    - 霧病治疗资料
    - 魔素适应观察记录
