---
核心世界观:
  世界定调: 低魔时代建立起的魔导蒸汽文明圈，剑、魔法机器与魔素回潮共存，不属于废土，也不向现代机甲与纯正乌托邦偏移
  纪元断代:
    远古高魔纪元: 大气充满魔雾，古代种、魔法生物与徒手施法文明繁盛
    大消隐期: 未知灾难导致大气魔素大幅枯竭，古代魔法衰落，魔法生物退入高魔雾残留区或沉眠
    低魔工业纪元: 现代幸存人类失去高魔雾耐受性与徒手施法能力，通过发掘地下魔素矿建立魔导工业文明

  底物理论_魔素与魔雾:
    魔素定义: 世界的底层魔力物质基础，不可凭空诞生
    存在形态_魔素矿: 地下高密度结晶脉络，需经魔导工业结构驯服转化为可用能源
    存在形态_魔雾: 游离于空气中的雾状形态
    魔素回潮: 现代人类大量开采与燃烧地下魔素矿，导致游离魔素重新排入大气，魔雾浓度逐年回升

  魔雾生态与风险:
    高浓度效应: 强化魔法现象，唤醒沉眠古代生态，吸引危险魔法生物
    燃烧残雾: 魔导工坊排出的不稳定混合物，包含破碎咒式与金属粉尘，引发城市边缘污染
    普通人脆弱性: 现代人类普遍缺乏耐受性，高浓度暴露会导致魔雾病、幻听、皮肤结晶与器官衰竭

  核心运转铁律:
    能量与代价守恒: 魔素矿并非万能魔法石，任何魔导设备必须建立在能源消耗、硬件维护与结构承载的基础上
    奇迹工业化: 现代社会通过机械复制低阶标准化法术，改善生存条件，但也产生了能源依赖、阶级认证与不可逆的环境污染
    不可还原律: 高阶古代魔法、神迹显现与灵魂共鸣无法通过普通民用机械稳定复刻
    世界客观性: 环境危险度、组织冲突与物质消耗严格遵从固有逻辑运作，不依个体意志或便利需求自发降低难度
