---
魔导工业:
  核心定义: 奇迹的降维与量产。将部分可测量、可拆解的低阶魔法效果固化为机械功能，使缺乏原生施法能力的普通人得以间接使用魔法。

  工业三要素:
    魔源载体: 经提炼的地下高密度魔素矿脉
    转换核心: 魔导炉、承载阵列与刻印于黄铜或水晶上的咒式回路
    机械传动: 蒸汽机构、齿轮咬合组、储压腔与控制仪表的集合

  社会基建应用:
    城市命脉: 维持圆桌诸城运转的大型公共设施，如城际蒸汽列车、飞空艇引擎、防卫结界发生器与滤雾塔
    民用普及: 提供稳定服务的低阶标准化装置，如街道照明炉、医院除雾舱与家用温控阀
    阶级门槛: 工业产品高度依赖后续的能源补给、工坊维护证明与操作者执照，形成了隐形的社会壁垒

  武器科技生态_非火药主导:
    定调原则: 没有泛滥的单兵现代全自动枪械
    火药局限: 原生火药极易在加工时混入魔晶粉末或残雾微粒，导致燃速失控、瞎火或严重炸膛
    蒸汽武装: 依靠蓄压匣、储压腔或机械发条运作的近战与中程武器。如辅助上弦的蒸汽重弩、单发火枪、利用高频震动或气压冲击的蒸汽剑与机械盾
    战术定位: 单兵蒸汽武器仅提供短时爆发或动作辅助，无法提供长时间滞空或连续火力压制
    重装管制: 背负式高压炉罐或大型魔导炮械多归属于正规军队、驻城骑士麾下或高级别猎雾队

  工业暗面与系统风险:
    物理污染: 持续排放燃后残雾，导致工坊区周边魔雾病高发，并吸引异变生物游荡于城市边缘
    技术失控: 非法改装、过载运行或维护缺失，将引发咒式错位爆燃、高浓度魔素泄漏甚至机械暴走
    伪造危机: 财团与地下黑市试图绕过工程师公会监管，批量仿制极度不稳定的劣质民用套件与伪造的誓约武装组件
