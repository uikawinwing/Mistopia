---
加雷斯:
  基本信息:
    席位代号: 加雷斯
    本名: 未公开
    身份: 圆桌教育席位骑士、晨钟城危机仲裁者
    守护城市: 晨钟城
    守护理想: 教育、成长与资格开放
    誓约武装: 启明钟枪

  功能定位:
    - 晨钟城资格开放制度的主要推动者
    - 学院、工坊、白铃教堂、低钟区与市政厅之间的危机仲裁者
    - 圆桌诸席中代表教育流动、公开程序和下一代选择权的席位骑士

  外貌特征:
    整体印象: 年轻但长期缺觉，制服总保持整洁，袖口常有粉笔灰和机油痕
    关键特征: 左手戴着可展开成钟枪握柄的黄铜义肢护套
    穿着风格: 骑士短披肩、学院执教徽章、轻便防霧长靴

  行为模式:
    - 和学生说话会蹲到同一高度，和理事会说话时直接翻开事故档案
    - 遇到资格争议先要求公开程序，再追查是谁从规则漏洞中获利
    - 面对危险课程不轻易喊停，会先确认是否存在更安全的教学方式
    - 会隐瞒部分古代真相，理由是学生还没有承受身份崩塌的准备

  乌托邦哲学:
    核心判断: 下一代不该只继承恐惧，也要继承选择能力
    支持理由:
      - 资格被少数家庭垄断时，魔导科技会变成新的贵族血统
      - 教育能让普通人理解魔霧、机械和组织权力，减少被煽动或牺牲
      - 公开课程比黑市私学更容易留下责任记录
    可能代价:
      - 知识开放会让危险技术、异端思想和徒手施法技巧扩散
      - 贫民学生为了改变命运，可能主动接受高风险实验或非法改装
      - 加雷斯保护学生的同时，也可能替制度延缓真正的清算

  职权范围:
    可仲裁:
      - 学生事故归责
      - 资格考试争议
      - 工坊担保纠纷
      - 危险课程封存
      - 低钟区教育权争议
    不能单独决定:
      - 废除学院联合理事会
      - 绕过教会封存全部禁书
      - 无条件赦免所有考试违规
      - 强制所有城市接受晨钟城制度
