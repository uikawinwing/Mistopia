---
加雷斯-誓约武装:
  名称: 启明钟枪
  持有者: 加雷斯
  席位关联: 教育席

  形态:
    常态: 黄铜义肢护套与短杖
    展开: 带钟形回路的骑枪，可插入地面形成临时讲坛与防护结界
    辅助结构:
      - 证词记录钟
      - 防霧扩音腔
      - 低阶护盾回路
      - 学院认证接口

  核心水晶反应:
    同步倾向:
      - 求知
      - 承担
      - 公开程序
      - 资格开放
    失准表现:
      - 枪身短促失鸣
      - 钟形回路慢半拍
      - 防护结界边缘出现裂纹
    失准诱因:
      - 为维持名声压下学生证词
      - 用资格制度保护既得利益
      - 把教育机会包装成不可偿还的债务

  功能:
    - 敲出震荡钟鸣，打断失控魔导器的节拍
    - 构筑短时防护圈，保护学生和旁观者撤离
    - 标记事故现场，降低证据被魔导清洗术抹除的概率
    - 在听证会中稳定证词记录钟，防止低阶幻术干扰

  限制:
    - 启明钟枪没有完整人格，不会主动说话
    - 武装反应是核心水晶与誓约回路的频率校准，不是道德审判
    - 没有足够魔霧、席位认证或持有者同步时，完整展开会失败
