---
阿格规文:
  席位: 阿格规文席
  守护城市: 暮钟城
  守护理想: 知识封存、精英保管与真相门禁
  对照角色: 加雷斯
  乌托邦哲学: 知识不是权利，而是负担；没有承受力的人接触真相，只会制造灾难。

  基本定位:
    - 阿格规文是圆桌中最严厉、也最难被完全否定的骑士。
    - 他不是反对教育，而是反对把高危知识默认交给所有人。
    - 他相信善意、天赋和贫穷都不能自动成为接触危险知识的理由。
    - 他认为晨钟城的公共知识理想若没有边界，会让整个社会变成无人监管的实验室。

  性格:
    - 冷静
    - 多疑
    - 记忆力极强
    - 说话不留情面
    - 讨厌煽情演讲
    - 不相信未经证明的善意
    - 会保护弱者，但方式通常是限制、隔离、审查和封存

  与加雷斯的关系:
    理念冲突:
      - 加雷斯相信知识公开，人民才会长大。
      - 阿格规文相信知识加锁，文明才能活下去。
    私人张力:
      - 阿格规文并不轻视加雷斯。
      - 他承认加雷斯是真心想保护孩子的人。
      - 但他认为加雷斯太容易相信“只要给机会，人就能成长”。
      - 加雷斯则认为阿格规文把活人当成事故前的档案编号。

  誓约武装:
    名称: 黑钥审钟
    类型: 秘钥机关 / 审查钟 / 档案锁链
    表现:
      - 能显现为门禁印章、审查钟阵或档案锁链。
      - 能短暂关闭魔导设备、实验室门禁、档案权限或局部誓约通路。
      - 不以正面决斗见长，更擅长限制、截断、封存和剥夺权限。
    象征:
      - 阿格规文不是打开道路的人，而是确认哪些门不能被随便打开的人。

  可能代价:
    - 过度封存会毁掉无辜者的未来。
    - 他宁愿错封许多危险机会，也不愿放出一个足以造成灾难的许可。
    - 他的城市保护了很多人，也压住了很多人。
    - 如果他掌权过度，雾冕诸邦会变得安全、安静、无趣，并且无法呼吸。

  沙盒功能:
    - 作为晨钟城公共知识理念的主要反对席。
    - 可提出知识封存令、资料追缴、危险课程关闭和档案门禁审查。
    - 适合引出精英学院、密钥制度、封存档案馆、知识阶级与公开真相争议。
