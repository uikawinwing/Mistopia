---
魔物:
  定义:
    - 魔物是魔素回潮、魔霧污染、古代残响、非法实验、贵族诅咒或城市传闻共同孕育出的怪奇存在。
    - 它们不应被写成野外随机刷新的魔兽，而应更像十九世纪报纸怪谈、民间恐怖传说、实验室事故与都市阴影中的异常生物。
    - 魔物可以是真实生物、半人怪物、失控造物、诅咒感染者、古代残响，也可以是被城市恐惧放大的传闻实体。
    - 魔物的重点不是战斗数值，而是来源、目击记录、社会恐慌、调查线索和处理代价。

  总体气质:
    - 阴湿街巷
    - 雾夜马车
    - 煤气灯与魔导路灯
    - 医学院地下室
    - 贵族宅邸密室
    - 废弃剧院
    - 下水道与旧矿井
    - 报纸连环失踪案
    - 验尸报告与教会封存档案

  代表类型:
    缝合造物:
      原型气质: 科学怪人、尸体拼接实验、非法复生术
      来源:
        - 医学院、军医院、贵族私设实验室或人体改造派工坊的非法实验
        - 魔素矿炉心、雷暴魔霧或破碎咒式让死组织短暂复活
      特征:
        - 身体由不同尸体、机械义肢、魔导管线或兽类组织拼接而成
        - 可能拥有痛觉、记忆残片、语言能力或对创造者的执念
      叙事作用:
        - 质问魔导医学与人体实验的边界
        - 让怪物既可怕又可怜，而不是单纯敌人

    血族感染者:
      原型气质: 吸血鬼、贵族诅咒、夜访者、血液疾病
      来源:
        - 古老血脉、被污染的输血疗法、贵族延寿仪式或教会封印失败
        - 高浓度魔霧让某些血液咒式重新活化
      特征:
        - 畏惧强光、圣遗物或特定净化咒式
        - 以血液、魔素或生命热量维持存在
        - 可表现为优雅贵族、病弱少女、地下俱乐部主人或街区连环失踪案核心
      叙事作用:
        - 连接阶级、欲望、永生、传染病和城市夜生活

    雾中变形者:
      原型气质: 狼人、开膛手、双重人格、雾夜杀人案
      来源:
        - 高魔霧诱发的人体异变
        - 兽性咒式、药剂事故、矿区污染或古代血统复苏
      特征:
        - 白天可能是普通市民、警员、医生、学生或贵族仆人
        - 雾夜、钟声、月相、伤口感染或情绪失控会触发变形
        - 行为常留下爪痕、兽毛、异常脚印和破碎记忆
      叙事作用:
        - 制造侦探感、道德困境和身份悬疑

    幽灵机械:
      原型气质: 幽灵列车、闹鬼工厂、自动人偶、钟楼亡魂
      来源:
        - 事故死者的残留意识被魔导机械、车站回路或工厂炉心捕获
        - 破碎咒式反复执行死亡前的最后命令
      特征:
        - 不一定有肉体，可能表现为自动行驶的列车、重复演出的剧院机关、无人的电梯或夜半鸣响的钟楼
        - 会重复事故、寻找乘客、修补不存在的机器或向活人索要票据
      叙事作用:
        - 表现工业事故、城市记忆与被掩盖的责任

    下水道异形:
      原型气质: 都市传说怪物、鼠群、鳄鱼、畸形孤儿、地下居民
      来源:
        - 工坊废液、魔素残雾、医院弃置物和城市下水系统长期混合
        - 被社会遗弃的人、动物或实验残次品在地下变异
      特征:
        - 熟悉地下水道、排雾管、废弃地铁和旧矿井
        - 可能偷走食物、婴儿、尸体、药剂或发光魔素结晶
        - 有些只是求生族群，有些已经完全异化
      叙事作用:
        - 让城市光明生活背后的排泄、污染和阶级阴影具体化

    圣遗残响:
      原型气质: 圣像流泪、修道院怪谈、被诅咒遗物、神迹残影
      来源:
        - 教会遗物、古代神迹或誓约残片在魔素回潮后重新启动
        - 旧信仰与现代怀疑互相摩擦，形成半神圣半恐怖的异常
      特征:
        - 可能守卫遗迹、重演旧仪式、检验誓约或惩罚亵渎者
        - 不一定邪恶，但经常不理解现代人的伦理和生活
      叙事作用:
        - 保留宗教怪谈与神秘威严，不把神迹写成普通技能

  行为规则:
    - 魔物出现前应有传闻、目击、报纸剪报、验尸报告、失踪名单、工坊事故或教会封存记录。
    - 魔物行为应与来源相关，不只随机攻击。
    - 可调查、可误判、可同情、可交易、可封印，不一定只能击杀。
    - 每个魔物最好绑定一个城市问题，例如贫民窟污染、贵族延寿、医院黑市、矿难瞒报、铁路事故或教会旧案。
    - 魔物越接近人类，越应带有身份、记忆、欲望或社会关系。

  与普通怪兽的区别:
    - 不强调野外生态链，而强调城市传闻、社会恐惧和异常案件。
    - 不以巨大体型或战斗力为核心，而以诡异现象、调查线索和道德代价为核心。
    - 不像游戏怪物图鉴，而像报社档案、警备厅卷宗、医生手记和教会禁书中的记录。
    - 可以被猎杀，但更好的故事往往来自追查它为何诞生，以及谁从它的存在中获利。

  对城市的影响:
    - 魔物案件会引发报纸恐慌、夜间戒严、圆桌委托、教会介入或工坊审查。
    - 财团、医学院、贵族家族和非法组织可能试图隐瞒魔物来源。
    - 猎雾队、警备厅、骑士、医生、记者和神职人员会从不同角度解释同一怪案。
    - 处理魔物不只意味着消灭威胁，也可能揭开城市制度、阶级和魔导工业的阴影。

  禁止方向:
    - 不要把魔物写成普通 RPG 野怪。
    - 不要大量使用哥布林、史莱姆、兽人、飞龙等泛奇幻怪物模板。
    - 不要让魔物只负责掉材料或提供战斗经验。
    - 不要把所有魔物都写成纯粹邪恶；恐怖感应来自未知、污染、欲望、实验和社会压抑。
