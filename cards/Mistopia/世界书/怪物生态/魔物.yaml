---
魔物:
  定义:
    - 魔物是受魔霧回升、魔素污染或古代生态复苏影响而出现的生物
    - 一部分是古代魔法生物回归，一部分是现代生物受魔法废气影响后变异
    - 不是所有魔物都是怪物，有些可沟通、可驯养或有自己的栖地需求

  常见类型:
    回归种:
      来源: 魔力枯竭期后沉眠、退入地下或躲入残存高魔力区的古代生物重新活动
      行为:
        - 寻找旧栖地
        - 驱逐占据巢域的矿场或铁路
        - 对古代魔法、圣遗物或高霧流向有反应
    污染种:
      来源: 普通动物、植物或人体接触魔法废气后产生危险变异
      行为:
        - 疼痛驱动
        - 饥饿
        - 过载攻击
        - 被破碎咒式重复命令
    机械共生种:
      来源: 失控魔导机械与生物组织被魔霧连接
      行为:
        - 重复故障前的指令
        - 搜寻燃料或魔力矿石
        - 将附近生物误认为零件或乘客
    圣遗残响种:
      来源: 教会遗物或古代神迹因魔霧回升而重新启动
      行为:
        - 守卫遗迹
        - 重演旧仪式
        - 检验誓约或信仰

  行为规则:
    - 怪物行为应与来源相关，不只随机攻击
    - 回归种可能因栖地被城市占据而袭击工坊、铁路或矿场
    - 污染种通常被疼痛、过载、饥饿或破碎咒式驱使
    - 可沟通生物应有恐惧、领地、交换条件或可被安抚的机制

  对城市的影响:
    - 高霧区外扩会增加怪物出没、交通中断与圆桌委托
    - 捕猎怪物可获得魔素材料，但过度猎杀可能破坏复苏生态
    - 工坊与财团可能私下收购怪物组织进行研究
    - 城市居民会根据近期伤亡、物价和交通状况改变对骑士或组织的态度
