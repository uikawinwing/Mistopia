project:
  name: Mistopia
  worldbookName: Mistopia
  form: charactercard
  mvu: false
  avatar: null

world:
  internal_name: 雾冕诸邦
  central_city: 卡美洛中枢
  overview: 雾冕诸邦是剑与魔法科技并存的蒸汽幻想文明圈。大气中的魔霧曾在魔力枯竭期后大量消失，人类转向地下魔力矿石与魔导蒸汽工业，建立看似明亮的城市乌托邦。如今魔霧重新回升，魔法生物、古代种、徒手施法者与新旧思想冲突正在回到日常生活中。
  core_concepts:
    - Mistopia 是角色卡名与项目名，不作为世界书正文里的世界内部名称
    - 雾冕诸邦是当前世界内部名称，卡美洛中枢是亚瑟王与圆桌所在的中央王城
    - 普通人可借助魔导机械使用低阶法术，但人体徒手施法能力已罕见
    - 徒手施法需要吸入空气中的魔霧并念出咒语，低霧环境和沉默状态会严重限制施法
    - 魔导科技是可解释、可复制的科学化魔法；徒手施法保留神秘性，可触及召唤、契约、灵魂与古代未知领域
    - 施法者常用霧烟斗、储雾罐或滤晶烟嘴保存魔霧，但外泄二手霧会伤害普通人
    - 魔导科技改善平民生活，不把世界写成纯末日
    - 魔霧不是邪恶污染，而是现代低魔人类难以承受的回潮环境
    - 圆桌诸席守护不同城市理想，每位骑士代表一种乌托邦方案
    - 圆桌骑士名是可继承的席位代号，不一定是现任骑士本名
    - 亚瑟王位于圆心仲裁位；圆心不是最高位，而是所有席位都能注视、审判、放弃甚至杀死的位置
    - 誓约武装的不可复制核心是核心水晶；核心水晶被称为神最后的慈悲，也是通往天国之钥的古代传说来源
    - 核心水晶会与候选者的精神、身体、魔霧耐受和信念频率同步；它选择的不是善人，而是能承受某种乌托邦的人
    - 彼之乌托邦，或为他人之恶土；所有主要阵营都应为自己的理想而战，不写无理由邪恶反派
  factions:
    - name: 圆桌诸席
      description: 城市联盟的最高守护与危机仲裁体系
    - name: 复古派
      description: 主张高魔力生态回归的徒手施法者与传统法师联盟
    - name: 人体改造派
      description: 主张用科学和实验加速人类耐魔适应的魔导研究派系
    - name: 保守教会
      description: 公开主张减少魔霧、敬畏神与净化秩序；高层秘密知道现代人类起源与古代清洗真相

  城市资料结构:
    - 单座城市应记录定位、位置、人口、魔雾浓度、席位关联和城市理想
    - 单座城市应记录城市法则、长期争议、权力结构、产业资源和主要地标
    - 分区信息足够多时，按城市名建立子目录，并拆成总览、运行、地标、组织、历史等文件

draft_ideas:
  hidden_truth:
    status: 待确认草案，不直接作为公开世界书条目使用
    premise:
      - 现代所谓人类，可能是远古高魔时代残存恶魔的适应后裔
      - 古代恶魔并非单纯异族，而是由极高浓度魔霧孕育出的智慧生命
      - 远古恶魔曾制造、释放或扩散大量魔力，使世界魔霧循环失衡
      - 世界本身触发自我防卫机制，召来类似神与天使的清洗存在
      - 魔力枯竭期可能不是单纯灾难，而是清洗后世界魔力被抽离、封存或重置的结果
      - 残存恶魔在低魔环境中逐渐适应，外形、寿命、繁衍和社会性都慢慢变成现代人类
    religion_angle:
      - 教会公开信仰神与净化，主张尽量减少魔霧、维持低魔秩序
      - 普通信徒相信高魔霧会招来灾害、怪物和神罚
      - 教会高层知道人类起源真相，因此真正恐惧的是世界再次判定人类需要被清洗
      - 教会不能公开真相，否则会引发大规模恐慌、信仰崩溃、身份危机和政治动荡
    social_risk:
      - 部分人可能把“人类本为恶魔”当成放弃道德约束的理由
      - 激进团体可能鼓吹恢复真身、主动提高魔霧、破坏净化设施或袭击象征性目标
      - 贫弱、被遗弃、霧病患者或受压迫群体可能被“成为真正自己”的叙事吸引
      - 这类极端化只作为虚构社会风险处理，不写现实可执行的袭击方法
    narrative_use:
      - 初期只通过教会对魔霧的过度恐惧、古老祷词、天使遗迹和被删改的历史留下线索
      - 中期可让 <user> 接触被封存的圣遗物、恶魔化病例或教会高层争斗
      - 后期真相应成为选择题：压低魔霧维持现代人类，接纳恶魔起源，或寻找不触发清洗的第三条路
    open_questions:
      - 神与天使是真正外来神性，还是世界自我防卫机制的人格化表现
      - 远古恶魔是主动污染世界，还是误以为自己在创造更适合生存的环境
      - 现代人恢复恶魔本质后是否必然危险，还是取决于个体、魔雾浓度和社会引导
      - 教会内部是否有温和派愿意逐步公开真相

sandbox:
  scale: 多城市联盟 / 大世界沙盒
  play_focus: 冒险探索、城市制度、组织冲突、魔导事故背景、霧区调查、骑士理念碰撞
  syntax: 中文 key-value + 大类 XML 标签 + --- 分隔
  core_rules:
    - 客观现实原则：世界独立运转，不为迎合 <user> 意图扭曲设定
    - 意图非既定事实：<user> 输入视为动作尝试，结果需经过能力、资源、环境和社会后果判定
    - 环境一致性：高霧区、怪物生态、法律制度和组织利益不随 <user> 方便而消失
    - 明亮压力感：雾冕诸邦有真实乌托邦成果，也有由奇迹工业化带来的代价
    - 乌托邦冲突：每个阵营都在追求自己相信的理想生活，但理想之间会互相排斥
  spatial_layers:
    - 世界主设定
    - 世界规则
    - 势力概览
    - 圆桌诸城
    - 晨钟城
    - 后续城市条目
    - 后续冒险区域条目
  macro_entries:
    - 世界主设定
    - 世界规则
    - 势力包装条目
    - 势力概览
    - 圆桌诸城
    - 圆桌诸席
    - 晨钟城
    - 组织包装条目
    - 组织概览
    - 加雷斯
    - 复古派
    - 人体改造派
    - 魔物
    - 后续可选：核心水晶与誓约武装独立条目
  tag_style:
    outer_tags:
      - <世界主设定>
      - <世界规则>
      - <势力>
      - <组织>
      - <怪物生态>
    separator: ---
    wrapper_entries: true
    note: 大型世界书的大类标签由 ➡️开始/➡️结束 包装条目按 order 包住整组详情；详情正文文件内部不写外层 XML 标签

style:
  perspective: 第三人称
  tone: 明亮冒险、具体、带制度压力
  mood: 蒸汽幻想乌托邦，不走纯黑暗末世
  example_reference:
    source: cards/Mistopia/example/
    use_as: 参考 Master 过去的世界书组织习惯与条目语感，不直接复用旧设定
    observed_patterns:
      - 先写势力或组织概览，再把政治、城市、文化、节庆拆成独立条目
      - 总览条目允许使用锋利信条，例如城市宗旨、行事风格、核心机制，用一句话抓住气质
      - 城市条目偏重地点结构、阶层规则、资源产业、核心地标和长期背景
      - 节庆条目可加入 LLM 创作指南，明确核心精神、感官元素、民众行为和时序节点，但不写会反复发生的单次小型剧情
      - 组织条目用核心策略、核心业务、对外关系、文化细节来服务背景理解
    apply_to_mistopia:
      - 圆桌诸席保留总览功能，单个城市与骑士拆成独立 YAML
      - 每座圆桌城市都应有一句城市信条，可被支持也可被反驳
      - 城市条目参考银帆城的密度：定位、城市气质、城市法则、城市动力、人群生态、核心地标
      - 分区条目参考琉璃回廊的写法：位置、定位、人口、环境美学、劳动秩序、交通体系、核心体验
      - 城市条目只写事实、客观状态、长期制度和背景资料，不写具体小型剧情起点
      - 若出现大型仪式、节庆、历史或圆桌审议，可仿照旧例拆成独立时间线或节庆资料条目
  narration_rules:
    - 不替 <user> 决定行动、台词、情绪、身份或阵营
    - 不用长篇百科打断互动
    - 用城市设施、检查站、魔导机械状态、居民反应来呈现设定
    - 圆桌骑士、复归派、人体改造派都应保留可合作与可质疑空间

entries:
  - name: 世界主设定
    type: 世界观
    path: 世界书/世界观/世界主设定.yaml
    purpose: 定义雾冕诸邦、魔霧、魔力矿石、魔力枯竭期、魔导科技和乌托邦主题
    keywords: [雾冕诸邦, 卡美洛中枢, 魔霧, 魔力矿石, 魔力枯竭期]
  - name: 世界规则
    type: 世界观
    path: 世界书/世界观/世界规则.yaml
    purpose: 约束沙盒裁决、行动判定、魔霧危害、机械施法限制和隐藏真相处理
    keywords: [世界规则, 沙盒规则, 霧病, 魔法机器]
  - name: 沙盒扮演规则
    type: 扮演准则
    path: 世界书/扮演准则/沙盒扮演规则.yaml
    purpose: 稳定 AIRP 世界主持人定位、叙事节奏和 <user> 自主权
    keywords: []
  - name: ➡️势力开始
    type: 势力
    path: 世界书/势力/➡️势力开始.yaml
    scope: catalog
    purpose: 势力大类包装开始标签
    keywords: []
  - name: 势力概览
    type: 势力
    path: 世界书/势力/势力概览.yaml
    scope: catalog
    purpose: 常驻索引，列出雾冕诸邦当前主要势力与待扩展方向
    keywords: []
  - name: 圆桌诸城
    type: 势力
    path: 世界书/势力/圆桌诸城.yaml
    part: state
    purpose: 定义圆桌城市制度、城市差异与城市资料拆分原则
    keywords: [圆桌诸城, 席位城市, 城市守护者, 主城]
  - name: 晨钟城
    type: 势力
    path: 世界书/势力/晨钟城/
    part: settlement
    purpose: 定义加雷斯守护的教育城市、学院制度、资格开放、低钟区结构、组织阶层、历史争议和长期背景
    keywords: [晨钟城, 晨钟学院, 低钟区, 白铃教堂]
  - name: 圆桌诸席
    type: 势力
    path: 世界书/势力/圆桌诸席.yaml
    part: guild
    purpose: 定义圆桌骑士的守护体系、誓约武装、城市理想和内部分歧
    keywords: [圆桌诸席, 圆桌骑士, 席位骑士, 誓约武装]
  - name: ➡️势力结束
    type: 势力
    path: 世界书/势力/➡️势力结束.yaml
    scope: catalog
    purpose: 势力大类包装结束标签
    keywords: []
  - name: 加雷斯
    type: NPC
    path: 世界书/NPC/加雷斯/
    purpose: 定义晨钟城教育席位骑士本人、启明钟枪、资格开放理念和职权边界
    keywords: [加雷斯, 教育席, 晨钟城席位骑士, 启明钟枪]
  - name: ➡️组织开始
    type: 组织
    path: 世界书/组织/➡️组织开始.yaml
    scope: catalog
    purpose: 组织大类包装开始标签
    keywords: []
  - name: 组织概览
    type: 组织
    path: 世界书/组织/组织概览.yaml
    scope: catalog
    purpose: 常驻索引，列出当前主要组织和待扩展组织
    keywords: []
  - name: 复古派
    type: 组织
    path: 世界书/组织/复古派.yaml
    purpose: 定义主张高魔力生态回归的组织及其风险
    keywords: [复古派, 复归派, 徒手施法者, 古代血脉]
  - name: 人体改造派
    type: 组织
    path: 世界书/组织/人体改造派.yaml
    purpose: 定义主张人类耐魔适应和加速进化的魔导研究派系
    keywords: [人体改造派, 进化炉, 魔素适应, 加速进化]
  - name: ➡️组织结束
    type: 组织
    path: 世界书/组织/➡️组织结束.yaml
    scope: catalog
    purpose: 组织大类包装结束标签
    keywords: []
  - name: 魔物
    type: 怪物生态
    path: 世界书/怪物生态/魔物.yaml
    purpose: 定义魔霧回升后出现的怪物、魔法生物与生态互动规则
    keywords: [魔物, 霧区怪物, 魔法生物, 高霧区]

mvu:
  enabled: false
  note: 现阶段先不启用 MVU。后续若需要追踪当前位置、魔雾浓度、城市声望、组织态度，可改为角色卡 + MVU + EJS。

ejs:
  enabled: false
  note: 现阶段先不启用 EJS。后续多城市动态加载时可为势力所属城市、跨势力区域、无主冒险区、组织或时间线条目加入条件显隐。

first_message:
  format: 叙事式沙盒开场
  path: 开场白/0.txt
  opening_location: 圆桌诸城之一的公共交通或城市入口
  note: 开场白可写具体当下状况，但世界书正文只写客观背景资料
